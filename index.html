<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>던전 TRPG - 로비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0a0908;
    --panel: #141210;
    --panel-2: #1b1714;
    --blood: #6e1414;
    --blood-bright: #9c2020;
    --iron: #3a3530;
    --bone: #cfc6b0;
    --bone-dim: #8c8575;
    --rust: #5e3a22;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--bone);
    display: flex;
    justify-content: center;
    padding: 30px 14px 60px;
    position: relative;
  }

  /* 거친 노이즈 텍스처 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, transparent 30%, rgba(0,0,0,0.65) 100%);
  }

  .wrap { width: 100%; max-width: 440px; position: relative; z-index: 1; }

  .title-block { text-align: center; margin-bottom: 26px; }

  h1 {
    font-size: 25px;
    font-weight: 900;
    margin: 0;
    letter-spacing: 2px;
    color: var(--bone);
    text-shadow: 2px 2px 0 #000, 0 0 14px rgba(110, 20, 20, 0.5);
  }

  .subtitle {
    font-size: 11px;
    color: var(--bone-dim);
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
  }

  .subtitle::before, .subtitle::after { content: "✦"; margin: 0 8px; color: var(--blood-bright); }

  /* 찢어진/거친 느낌의 패널 */
  .panel {
    background: var(--panel);
    border: 2px solid var(--iron);
    outline: 1px solid #000;
    outline-offset: -5px;
    padding: 22px 20px;
    clip-path: polygon(
      0 6px, 6px 0, 100% 0, 100% calc(100% - 8px),
      calc(100% - 8px) 100%, 0 100%
    );
    box-shadow: 0 10px 0 rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.5);
    position: relative;
  }

  label.field-label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--blood-bright);
    margin: 0 0 7px 1px;
    font-weight: 700;
  }

  input {
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    padding: 12px 13px;
    margin-bottom: 16px;
    border: 2px solid var(--iron);
    background: #000;
    color: var(--bone);
    outline: none;
  }
  input::placeholder { color: #55503f; }
  input:focus { border-color: var(--blood-bright); }

  button {
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 14px;
    border: 2px solid #000;
    cursor: pointer;
    color: var(--bone);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 10px 100%);
    transition: filter 0.1s ease;
  }
  button:active { filter: brightness(0.8); transform: translateY(1px); }

  .btn-primary {
    background: linear-gradient(180deg, var(--iron), #241f1a);
    box-shadow: inset 0 0 0 1px #000, 0 6px 0 #000;
  }
  .btn-primary:hover { background: linear-gradient(180deg, #4a443c, var(--iron)); }

  .btn-blood {
    background: linear-gradient(180deg, var(--blood), #4a0d0d);
    box-shadow: inset 0 0 0 1px #000, 0 6px 0 #000;
  }
  .btn-blood:hover { background: linear-gradient(180deg, var(--blood-bright), var(--blood)); }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--bone-dim);
    font-size: 11px;
    letter-spacing: 2px;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--iron);
  }
  .divider span { padding: 0 10px; }

  #roomInfo { display: none; }

  .room-code-card {
    text-align: center;
    padding: 16px;
    margin-bottom: 20px;
    background: #000;
    border: 2px dashed var(--iron);
  }

  .room-code-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--bone-dim);
    margin-bottom: 8px;
  }

  #roomCode {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
    color: var(--blood-bright);
    text-shadow: 2px 2px 0 #000;
  }

  h3.section-title {
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--bone-dim);
    margin: 4px 0 12px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h3.section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--iron);
  }

  #playerList {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #playerList li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 13px;
    background: #000;
    border-left: 3px solid var(--blood);
  }

  .player-name { font-weight: 700; letter-spacing: 0.5px; }

  .host-tag {
    font-size: 10px;
    color: #000;
    background: var(--bone);
    padding: 3px 7px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .class-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 4px;
  }

  .class-card {
    background: #000;
    border: 2px solid var(--iron);
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .class-card:nth-child(5) { grid-column: 1 / span 2; }

  .class-card .icon { font-size: 26px; display: block; margin-bottom: 6px; }
  .class-card .cname { font-size: 14px; font-weight: 900; letter-spacing: 0.5px; }
  .class-card .cstat { font-size: 10px; color: var(--bone-dim); margin-top: 3px; letter-spacing: 0.5px; }

  .class-card.mine {
    border-color: var(--blood-bright);
    background: linear-gradient(180deg, rgba(110,20,20,0.25), #000);
  }
  .class-card.mine .cname { color: var(--blood-bright); }

  .class-card.taken {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .class-card.taken .cstat { color: var(--blood-bright); }

  #partyStatus {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #partyStatus li {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    background: #000;
    border-left: 3px solid var(--iron);
    font-size: 13px;
  }
  #partyStatus li.ready { border-left-color: var(--blood-bright); }
  #partyStatus .pname { font-weight: 700; }
  #partyStatus .pclass { color: var(--bone-dim); }
  #partyStatus li.ready .pclass { color: var(--blood-bright); }


  /* ---- 몬스터 아바타 & 모션 ---- */
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .monster-avatar.hit {
    animation: hitShake 0.35s ease;
  }
  @keyframes hitShake {
    0% { transform: translateX(0) scale(1); }
    20% { transform: translateX(-10px) scale(0.96); filter: brightness(2) drop-shadow(0 0 20px var(--blood-bright)); }
    50% { transform: translateX(8px) scale(1.02); }
    100% { transform: translateX(0) scale(1); }
  }
  .monster-avatar.dead {
    animation: deathFall 0.6s ease forwards;
    filter: grayscale(1) brightness(0.4);
  }
  @keyframes deathFall {
    0% { transform: rotate(0) translateY(0); opacity: 1; }
    100% { transform: rotate(90deg) translateY(20px); opacity: 0.35; }
  }

  .hpbar-outer {
    background: #000;
    border: 2px solid var(--iron);
    height: 16px;
    position: relative;
    overflow: hidden;
  }
  .hpbar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.4s ease;
  }
  .hpbar-monster { background: linear-gradient(90deg, var(--blood), var(--blood-bright)); }
  .hpbar-player { background: linear-gradient(90deg, #3a5a3a, #5a8a5a); }


  /* ---- 전투 무대: 좌측 파티 vs 우측 몬스터 ---- */
  #battleScreen.panel { padding: 22px 14px; }
  .stage {
    --slot: clamp(62px, 10vh, 92px);   /* 파티원 1명의 크기 기준 (화면 높이에 맞춰 자동 조절) */
    display: flex;
    align-items: stretch;
    gap: 6px;
    margin: 6px 0 16px;
  }
  .stage-party {
    flex: 0 0 50%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stage-monster {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .slot {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: var(--slot);
    padding: 0 2px 0 2px;
    border-left: 3px solid transparent;
    position: relative;
    transition: background 0.2s, border-color 0.2s;
  }
  .slot:nth-child(even) { margin-left: 10px; }   /* 대형이 살짝 엇갈리게 */
  .slot.current {
    border-left-color: var(--blood-bright);
    background: linear-gradient(90deg, rgba(110,20,20,0.35), transparent);
  }
  .slot.current::before {
    content: "▶";
    position: absolute;
    left: -14px; top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--blood-bright);
  }
  .slot.me .slot-name { color: var(--bone); }
  .slot.me .slot-name::before { content: "★ "; color: var(--blood-bright); }

  .slot-sprite {
    flex: 0 0 calc(var(--slot) * 1.15);
    width: calc(var(--slot) * 1.15);
    height: var(--slot);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
  }
  .slot-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .slot-emoji {
    font-size: calc(var(--slot) * 0.62);
    line-height: 1;
    padding-bottom: 4px;
    display: inline-block;
  }
  .slot-info { flex: 1; min-width: 0; padding-bottom: 6px; }
  .slot-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--bone-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .slot-hp { height: 8px; border-width: 1px; }
  .slot-hptext { font-size: 9px; color: var(--bone-dim); margin-top: 2px; text-align: right; }

  .slot-sprite.hit { animation: hitShake 0.35s ease; }
  .slot-sprite.lunge { animation: lungeRight 0.4s ease; }
  @keyframes lungeRight {
    0% { transform: translateX(0) scale(1); }
    40% { transform: translateX(16px) scale(1.12); }
    100% { transform: translateX(0) scale(1); }
  }
  .slot.dead .slot-sprite { filter: grayscale(1) brightness(0.55) drop-shadow(0 3px 4px rgba(0,0,0,0.6)); }
  .slot.dead .slot-emoji { transform: rotate(80deg); }
  .slot.dead .slot-name { text-decoration: line-through; opacity: 0.6; }

  /* ---- 몬스터 (파티보다 훨씬 크게) ---- */
  .monster-avatar {
    font-size: calc(var(--slot) * 2.2);
    height: calc(var(--slot) * 3.1);
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    filter: drop-shadow(0 0 14px rgba(110, 20, 20, 0.6));
    animation: idleFloat 2.4s ease-in-out infinite;
  }
  .monster-sprite-img {
    max-height: 100%;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    transform: scaleX(-1);          /* 왼쪽의 파티를 바라보도록 좌우 반전 */
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  .monster-name { font-weight: 900; letter-spacing: 1px; margin: 8px 0 6px; text-align: center; }
  .monster-hp { width: 100%; }

  /* ---- 속도(턴 순서) 바 ---- */
  .turn-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    align-items: flex-end;
    margin: 0 0 16px;
  }
  .turn-round {
    width: 100%;
    text-align: center;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--bone-dim);
    margin-bottom: 4px;
  }
  .turn-chip {
    background: #000;
    border: 2px solid var(--iron);
    padding: 7px 3px 4px;
    font-size: 9px;
    flex: 1 1 0;
    min-width: 0;
    max-width: 58px;
    overflow: hidden;
    text-align: center;
    position: relative;
    transition: transform 0.2s, border-color 0.2s;
  }
  .turn-chip .tc-order {
    position: absolute;
    top: -8px; left: -6px;
    background: var(--iron);
    color: var(--bone);
    font-size: 9px;
    font-weight: 900;
    padding: 0 5px;
  }
  .turn-chip .tc-icon { font-size: 16px; display: block; margin-bottom: 2px; }
  .turn-chip .tc-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .turn-chip.monster { border-style: dashed; }
  .turn-chip.me .tc-name::before { content: "★"; color: var(--blood-bright); }
  .turn-chip.current {
    border-color: var(--blood-bright);
    background: linear-gradient(180deg, rgba(110,20,20,0.4), #000);
    transform: translateY(-4px);
  }
  .turn-chip.current .tc-order { background: var(--blood-bright); }
  .turn-chip.dead { opacity: 0.3; }
  .turn-chip.dead .tc-name { text-decoration: line-through; }

  .turn-hint {
    text-align: center;
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 0.5px;
    color: var(--bone-dim);
    min-height: 16px;
  }
  .turn-hint.mine { color: var(--blood-bright); font-weight: 900; }

  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.my-turn { animation: turnPulse 1.1s ease-in-out infinite; }
  @keyframes turnPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.6); }
  }

  #status {
    text-align: center;
    font-size: 11px;
    color: var(--bone-dim);
    margin-top: 20px;
    letter-spacing: 0.5px;
  }
  #status.ok { color: #7a8c6a; }
  #status.ok::before { content: "● "; }
</style>
</head>
<body>

<div class="wrap">
  <div class="title-block">
    <h1>던전 TRPG</h1>
  </div>

  <div class="panel" id="setup">
    <label class="field-label">모험가 이름</label>
    <input id="nameInput" placeholder="이름을 입력하세요" maxlength="12">

    <button class="btn-primary" onclick="createRoom()">새로운 던전 열기</button>

    <div class="divider"><span>혹은</span></div>

    <label class="field-label">입장 코드</label>
    <input id="joinCodeInput" placeholder="예: AB3X9" maxlength="5" style="text-transform:uppercase">
    <button class="btn-blood" onclick="joinRoom()">파티에 합류하기</button>
  </div>

  <div class="panel" id="roomInfo">
    <div class="room-code-card">
      <div class="room-code-label">던전 입장 코드</div>
      <div id="roomCode">-----</div>
    </div>

    <h3 class="section-title">파티원 (<span id="playerCount">0</span>/5)</h3>
    <ul id="playerList"></ul>

    <button class="btn-blood" id="startGameBtn" style="display:none; margin-top:18px;" onclick="startGame()">
      던전으로 진입한다
    </button>
    <div id="hostHint" style="display:none; text-align:center; font-size:11px; color:var(--bone-dim); margin-top:12px; letter-spacing:0.5px;">
      호스트가 시작하기를 기다리는 중...
    </div>
  </div>

  <div class="panel" id="gameScreen" style="display:none;">
    <h3 class="section-title">직업을 선택하라</h3>
    <div id="classGrid" class="class-grid"></div>

    <h3 class="section-title" style="margin-top:20px;">파티 상태</h3>
    <ul id="partyStatus"></ul>

    <button class="btn-blood" id="startBattleBtn" style="display:none; margin-top:18px;" onclick="startBattle()">
      전투 시작
    </button>
    <div id="waitingHint" style="display:none; text-align:center; font-size:11px; color:var(--bone-dim); margin-top:12px; letter-spacing:0.5px;">
      모든 파티원이 직업을 고르는 중...
    </div>
  </div>

  <div class="panel" id="battleScreen" style="display:none;">
    <h3 class="section-title" style="justify-content:center;">전투 개시</h3>

    <div id="turnBar" class="turn-bar"></div>

    <div class="stage">
      <div id="battleParty" class="stage-party"></div>

      <div id="monsterArea" class="stage-monster">
        <div id="monsterAvatar" class="monster-avatar">
          <span id="monsterEmoji">👾</span>
          <img id="monsterSpriteImg" class="monster-sprite-img" src="" style="display:none;">
        </div>
        <div id="monsterName" class="monster-name">???</div>
        <div class="hpbar-outer monster-hp"><div id="monsterHpBar" class="hpbar-fill hpbar-monster"></div></div>
        <div id="monsterHpText" style="font-size:11px; color:var(--bone-dim); margin-top:4px;">-- / --</div>
      </div>
    </div>

    <button class="btn-blood" id="attackBtn" onclick="attack()">기본 공격</button>
    <div id="deadHint" style="display:none; text-align:center; font-size:12px; color:var(--bone-dim); margin-top:10px;">쓰러져서 움직일 수 없다...</div>
    <div id="turnHint" class="turn-hint"></div>

    <div id="battleLog" style="margin-top:16px; font-size:12px; line-height:1.7; color:var(--bone-dim); min-height:60px; border-left:3px solid var(--iron); padding-left:10px;"></div>
  </div>

  <div id="status">Firebase 연결 대기 중...</div>
</div>

<script>
  // ------------------------------------------------------------
  // Firebase 초기화
  // ------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyCMEwUt7yViIDEcJ3LVrbBolC1GQyWWwMk",
    authDomain: "tracp-a5417.firebaseapp.com",
    databaseURL: "https://tracp-a5417-default-rtdb.firebaseio.com",
    projectId: "tracp-a5417",
    storageBucket: "tracp-a5417.firebasestorage.app",
    messagingSenderId: "655251581595",
    appId: "1:655251581595:web:f5dcfdfaa875503da7743e",
    measurementId: "G-H816RT6VZG"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const statusEl = document.getElementById("status");
  statusEl.textContent = "Firebase 연결됨";
  statusEl.classList.add("ok");

  // ------------------------------------------------------------
  // 상태
  // ------------------------------------------------------------
  let currentRoomId = null;
  let currentPlayerId = null;
  let isHostPlayer = false;
  let myClass = null;
  let myPlayerData = null;
  let currentPartyEntries = [];
  let lastMonsterHp = null;
  let lastPlayerHp = {};

  let monsterIdleTimer = null;
  let monsterSpriteReady = false; // 같은 몬스터에 대해 idle 루프를 한 번만 시작하도록
  let monsterIsAttacking = false;
  let currentMonsterSpriteKey = null;
  let currentMonsterName = "몬스터";
  let combatState = null;
  let actionInProgress = false;
  let monsterTurnInProgress = false;
  let lastEventSeq = 0;

  const CLASS_DATA = [
    { id: "warrior", name: "전사",   icon: "⚔️", stat: "신체능력", statKey: "body" },
    { id: "mage",    name: "마법사", icon: "🔮", stat: "지능",     statKey: "intelligence" },

  // ---- 다이스 판정 (4d6, 홀수+1/짝수-1, 동일수 크리/펌블) ----
  function rollD6() { return Math.floor(Math.random() * 6) + 1; }

  function rollJudgment() {
    const dice = [rollD6(), rollD6(), rollD6(), rollD6()];
    let modifier = 0;
    dice.forEach(d => { modifier += (d % 2 === 1) ? 1 : -1; });

    const allSame = dice.every(d => d === dice[0]);
    const isOdd = dice[0] % 2 === 1;

    let resultType = "normal";
    if (allSame && isOdd) resultType = "critical";
    if (allSame && !isOdd) resultType = "fumble";

    return { dice, modifier, resultType };
  }

  // ---- 자원 계산 ----
  function calculateHP(stats) { return 20 + (stats.body * 3) + (stats.will * 1); }
  function calculateMana(stats) { return 10 + (stats.intelligence + stats.mind + stats.will); }

  // ---- 기본 스탯 생성 (주력 스탯 7, 나머지 4, 운 3) ----
  function generateDefaultStats(mainStatKey) {
    const stats = { body: 4, agility: 4, mind: 4, will: 4, intelligence: 4, luck: 3 };
    stats[mainStatKey] = 7;
    return stats;
  }

  // ---- 데미지 계산: 공격은 항상 명중 (명중/회피 판정 없음) ----
  //  · 데미지 = 기본 데미지 + 주사위 보정치(-4~+4), 최소 1은 반드시 들어감
  //  · 크리티컬(같은 홀수 4개): 2배
  //  · 약화(같은 짝수 4개): 기본 데미지의 절반 (최소 1)
  function calcDamage(baseDamage, judgment) {
    if (baseDamage <= 0) return 0; // 데미지가 없는 스킬(도발 등)
    if (judgment.resultType === "critical") return Math.max(1, baseDamage + judgment.modifier) * 2;
    if (judgment.resultType === "fumble")   return Math.max(1, Math.floor(baseDamage / 2));
    return Math.max(1, baseDamage + judgment.modifier);
  }

  function judgeLabel(resultType) {
    if (resultType === "critical") return " 💥크리티컬!";
    if (resultType === "fumble") return " (약화)";
    return "";
  }

  // actorStats 예: { body, agility, mind, will, intelligence, luck, mana }
  function resolveSkillAction(actorStats, skill) {
    if (actorStats.mana < skill.manaCost) {
      return { success: false, reason: "마나 부족" }; // 마나가 모자랄 때만 실패
    }

    const judgment = rollJudgment();
    const damage = calcDamage(skill.baseDamage, judgment);
    actorStats.mana -= skill.manaCost;

    return {
      success: true,
      resultType: judgment.resultType,
      dice: judgment.dice,
      modifier: judgment.modifier,
      damage,
      manaRemaining: actorStats.mana
    };
  }

  // ---- 데미지 적용 ----
  function applyDamage(hp, damage) { return Math.max(0, hp - damage); }

  function generateRoomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 헷갈리는 글자(0,O,1,I) 제외
    let code = "";
    for (let i = 0; i < 5; i++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
  }

  function generatePlayerId() {
    return "p_" + Math.random().toString(36).substring(2, 10);
  }

  // ------------------------------------------------------------
  // 방 만들기 (= 호스트가 됨)
  // ------------------------------------------------------------
  function createRoom() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) { alert("이름을 입력해주세요"); return; }

    const roomId = generateRoomCode();
    const playerId = generatePlayerId();

    db.ref(`rooms/${roomId}`).set({
      createdAt: Date.now(),
      hostId: playerId,
      players: {
        [playerId]: { name: name, isHost: true, joinedAt: Date.now() }
      }
    }).then(() => {
      enterRoom(roomId, playerId);
    }).catch(err => {
      alert("방 생성 실패: " + err.message);
    });
  }

  // ------------------------------------------------------------
  // 방 참가하기
  // ------------------------------------------------------------
  function joinRoom() {
    const name = document.getElementById("nameInput").value.trim();
    const roomId = document.getElementById("joinCodeInput").value.trim().toUpperCase();
    if (!name) { alert("이름을 입력해주세요"); return; }
    if (!roomId) { alert("방 코드를 입력해주세요"); return; }

    db.ref(`rooms/${roomId}`).get().then(snapshot => {
      if (!snapshot.exists()) {
        alert("존재하지 않는 방 코드예요");
        return;
      }

      const playerId = generatePlayerId();
      db.ref(`rooms/${roomId}/players/${playerId}`).set({
        name: name,
        isHost: false,
        joinedAt: Date.now()
      }).then(() => {
        enterRoom(roomId, playerId);
      });
    });
  }

  function renderLobbyList(entries) {

    entries.forEach(([id, p]) => {

      list.appendChild(li);

  function renderClassSelect(entries) {
    // classId -> 선택한 플레이어 id
    const takenBy = {};
    entries.forEach(([id, p]) => {
      if (p.class) takenBy[p.class] = id;
    });

    // 카드 그리드
    const grid = document.getElementById("classGrid");
    grid.innerHTML = "";

    CLASS_DATA.forEach(cls => {
      const card = document.createElement("div");
      card.className = "class-card";

      const takenPlayerId = takenBy[cls.id];
      const isMine = takenPlayerId === currentPlayerId;
      const isTakenByOther = takenPlayerId && !isMine;

      if (isMine) card.classList.add("mine");
      if (isTakenByOther) card.classList.add("taken");

      const takenName = isTakenByOther
        ? (entries.find(([id]) => id === takenPlayerId) || [null, {}])[1].name
        : null;

      card.innerHTML = `
        <span class="icon">${cls.icon}</span>
        <div class="cname">${cls.name}</div>
        <div class="cstat">${isTakenByOther ? esc(takenName) + " 선택함" : cls.stat}</div>
      `;

      if (!isTakenByOther) {
        card.onclick = () => selectClass(cls.id);
      }

      grid.appendChild(card);
    });

    // 파티 상태 리스트
    const statusList = document.getElementById("partyStatus");
    statusList.innerHTML = "";

    entries.forEach(([id, p]) => {
      const li = document.createElement("li");
      const classInfo = p.class ? CLASS_DATA.find(c => c.id === p.class) : null;
      if (classInfo) li.classList.add("ready");

      li.innerHTML = `
        <span class="pname">${esc(p.name)}</span>
        <span class="pclass">${classInfo ? classInfo.icon + " " + classInfo.name : "미정"}</span>
      `;
      statusList.appendChild(li);
    });

    // 전원이 직업을 골랐는지 확인 → 호스트에게만 전투 시작 버튼 노출
    const allReady = entries.length > 0 && entries.every(([id, p]) => !!p.class);
    const startBtn = document.getElementById("startBattleBtn");
    const waitingHint = document.getElementById("waitingHint");

    if (isHostPlayer && allReady) {
      startBtn.style.display = "block";
      waitingHint.style.display = "none";
    } else {
      startBtn.style.display = "none";
      waitingHint.style.display = allReady ? "none" : "block";
    }
  }

  // ------------------------------------------------------------
  // 전투 무대 — 좌측 파티원 슬롯 (직업 무관하게 전원 같은 방식으로 표시/연출)
  //  - 스프라이트가 있는 직업(현재 전사)은 도트 모션, 없는 직업은 큰 이모지 + CSS 모션
  // ------------------------------------------------------------
  const slots = {}; // playerId -> 슬롯 상태

  function restartCssAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth; // 리플로우로 같은 애니메이션 재시작
    el.classList.add(cls);
  }

  function ensureSlot(id) {
    if (slots[id]) return slots[id];

    const el = document.createElement("div");
    el.className = "slot";
    el.innerHTML = `
      <div class="slot-sprite"></div>
      <div class="slot-info">
        <div class="slot-name"></div>
        <div class="hpbar-outer slot-hp"><div class="hpbar-fill hpbar-player"></div></div>
        <div class="slot-hptext"></div>
      </div>
    `;

    slots[id] = {
      id: id,
      el: el,
      spriteBox: el.querySelector(".slot-sprite"),
      nameEl: el.querySelector(".slot-name"),
      hpFill: el.querySelector(".hpbar-fill"),
      hpText: el.querySelector(".slot-hptext"),
      classId: null,
      img: null,
      idleTimer: null,
      busy: false,
      dead: false,
      lastHp: undefined
    };
    return slots[id];
  }

  function removeSlot(id) {
    const s = slots[id];
    if (!s) return;
    if (s.idleTimer) clearInterval(s.idleTimer);
    s.el.remove();
    delete slots[id];
  }

  // 직업이 정해지면(또는 바뀌면) 스프라이트/이모지를 구성
  function setSlotClass(s, classId) {
    if (s.classId === classId) return;
    s.classId = classId;

    if (s.idleTimer) { clearInterval(s.idleTimer); s.idleTimer = null; }
    s.spriteBox.innerHTML = "";
    s.img = null;

    const sprites = SPRITE_SETS[classId];
    const info = CLASS_DATA.find(c => c.id === classId);

    if (sprites) {
      const img = document.createElement("img");
      img.className = "slot-img";
      img.src = sprites.idle[0];
      s.spriteBox.appendChild(img);
      s.img = img;

      let f = 0;
      s.idleTimer = setInterval(() => {
        if (s.busy || s.dead) return;
        f = (f + 1) % sprites.idle.length;
        img.src = sprites.idle[f];
      }, 110);
    } else {
      const em = document.createElement("span");
      em.className = "slot-emoji";
      em.textContent = info ? info.icon : "❔";
      s.spriteBox.appendChild(em);
    }
  }

  function slotAttack(id) {
    const s = slots[id];
    if (!s || s.dead) return;
    const sprites = SPRITE_SETS[s.classId];

    if (sprites && s.img) {
      s.busy = true;
      let i = 0;
      const step = () => {
        if (s.dead) return;
        if (i >= sprites.attack.length) { s.busy = false; return; }
        s.img.src = sprites.attack[i++];
        setTimeout(step, 80);
      };
      step();
    } else {
      restartCssAnim(s.spriteBox, "lunge"); // 스프라이트 없는 직업은 앞으로 튀어나오는 모션
    }
  }

  function slotHit(id) {
    const s = slots[id];
    if (!s || s.dead) return;
    const sprites = SPRITE_SETS[s.classId];

    if (sprites && sprites.hit && s.img) {
      s.busy = true;
      s.img.src = sprites.hit;
      setTimeout(() => { s.busy = false; }, 700);
    } else {
      restartCssAnim(s.spriteBox, "hit"); // 피격 이미지가 없으면 흔들림 + 번쩍임
    }
  }

  function slotDie(id) {
    const s = slots[id];
    if (!s || s.dead) return;
    s.dead = true;
    if (s.idleTimer) { clearInterval(s.idleTimer); s.idleTimer = null; }

    const sprites = SPRITE_SETS[s.classId];
    if (sprites && sprites.death && s.img) s.img.src = sprites.death;
    s.el.classList.add("dead");
  }

  // ------------------------------------------------------------
  // 몬스터 스프라이트 애니메이션
  // ------------------------------------------------------------
  function initMonsterSprite(spriteKey) {
    const sprites = MONSTER_SPRITES[spriteKey];
    const emojiEl = document.getElementById("monsterEmoji");
    const imgEl = document.getElementById("monsterSpriteImg");

    if (!sprites) {
      emojiEl.style.display = "block";
      imgEl.style.display = "none";
      return;
    }

    emojiEl.style.display = "none";
    imgEl.style.display = "block";
    monsterSpriteReady = true;
    playMonsterIdleLoop(spriteKey);
  }

  function playMonsterIdleLoop(spriteKey) {
    const sprites = MONSTER_SPRITES[spriteKey];
    if (!sprites) return;
    if (monsterIdleTimer) clearInterval(monsterIdleTimer);

    const img = document.getElementById("monsterSpriteImg");
    let frame = 0;
    img.src = sprites.idle[0];

    monsterIdleTimer = setInterval(() => {
      if (monsterIsAttacking) return;
      frame = (frame + 1) % sprites.idle.length;
      img.src = sprites.idle[frame];
    }, 130);
  }

  function playMonsterAttackAnim(spriteKey) {
    const sprites = MONSTER_SPRITES[spriteKey];
    if (!sprites) return;

    monsterIsAttacking = true;
    const img = document.getElementById("monsterSpriteImg");
    let i = 0;

    const step = () => {
      if (i >= sprites.attack.length) {
        monsterIsAttacking = false;
        return;
      }
      img.src = sprites.attack[i];
      i++;
      setTimeout(step, 90);
    };
    step();
  }

  function playMonsterHitAnim(spriteKey) {
    const sprites = MONSTER_SPRITES[spriteKey];
    if (!sprites || !sprites.hit) return;

    monsterIsAttacking = true; // idle 루프 끼어들지 않도록 재사용
    const img = document.getElementById("monsterSpriteImg");
    let i = 0;

    const step = () => {
      if (i >= sprites.hit.length) {
        monsterIsAttacking = false;
        return;
      }
      img.src = sprites.hit[i];
      i++;
      setTimeout(step, 70);
    };
    step();
  }

  // 같은 DOM 요소에서 애니메이션을 반복 재생하기 위한 헬퍼 (클래스 제거 → 리플로우 → 재추가)
  function pulseHit(el) {
    el.classList.remove("hit");
    void el.offsetWidth;
    el.classList.add("hit");
  }

  // ------------------------------------------------------------
  // 전투 화면 — 좌측 파티 무대 렌더링 (HP, 현재 턴 표시, 피격/쓰러짐 모션)
  // ------------------------------------------------------------
  function renderBattleParty(entries) {
    const container = document.getElementById("battleParty");
    if (!container) return;

    // 직업을 고른 사람만 표시, 전투 중에는 행동 순서대로 위에서부터 배치
    let list = entries.filter(([id, p]) => p.class);
    if (combatState && combatState.order) {
      const pos = id => { const i = combatState.order.indexOf(id); return i < 0 ? 99 : i; };
      list = list.slice().sort((a, b) => pos(a[0]) - pos(b[0]));
    }
    const curId = (combatState && combatState.order) ? combatState.order[combatState.index] : null;

    // 나간 사람/직업 해제한 사람 슬롯 제거
    Object.keys(slots).forEach(id => {
      if (!list.some(([pid]) => pid === id)) removeSlot(id);
    });

    list.forEach(([id, p], i) => {
      const s = ensureSlot(id);
      setSlotClass(s, p.class);

      // 순서가 달라진 경우에만 DOM 이동 (불필요한 이동은 CSS 애니메이션을 재시작시킴)
      if (container.children[i] !== s.el) container.insertBefore(s.el, container.children[i] || null);

      const hp = typeof p.hp === "number" ? p.hp : 0;
      const maxHp = typeof p.maxHp === "number" ? p.maxHp : 1;
      const isDead = !!p.maxHp && hp <= 0;
      const pct = maxHp > 0 ? Math.max(0, Math.round((hp / maxHp) * 100)) : 0;

      s.nameEl.textContent = p.name;
      s.hpFill.style.width = pct + "%";
      s.hpText.textContent = p.maxHp ? `${hp}/${maxHp}` : "대기";
      s.el.classList.toggle("current", id === curId && !isDead);
      s.el.classList.toggle("me", id === currentPlayerId);

      if (s.lastHp !== undefined && hp < s.lastHp && !isDead) slotHit(id);
      if (isDead) slotDie(id);
      s.lastHp = hp;
    });

    // 내가 쓰러졌으면 공격 버튼 숨기고 안내 문구 표시
    const mine = entries.find(([id]) => id === currentPlayerId);
    const myHp = mine ? mine[1].hp : null;
    const attackBtn = document.getElementById("attackBtn");
    const deadHint = document.getElementById("deadHint");
    if (attackBtn && myHp !== null && myHp !== undefined && myHp <= 0) {
      attackBtn.style.display = "none";
      deadHint.style.display = "block";
    } else if (attackBtn) {
      attackBtn.style.display = "block";
      deadHint.style.display = "none";
    }
  }

  // 카드 탭 시 직업 선택/해제 (선택 시 스탯/HP/마나 자동 계산)
  function selectClass(classId) {
    if (!currentRoomId || !currentPlayerId) return;

    const playerRef = db.ref(`rooms/${currentRoomId}/players/${currentPlayerId}`);

    if (myClass === classId) {
      // 선택 취소
      playerRef.update({ class: null, stats: null, hp: null, maxHp: null });
      return;
    }

    const classInfo = CLASS_DATA.find(c => c.id === classId);
    const stats = generateDefaultStats(classInfo.statKey);
    const hp = calculateHP(stats);
    stats.mana = calculateMana(stats);

    playerRef.update({ class: classId, stats: stats, hp: hp, maxHp: hp });
  }

  // ------------------------------------------------------------
  // 방 입장 후 — 실시간 플레이어 목록 구독
  // ------------------------------------------------------------
  function enterRoom(roomId, playerId) {
    currentRoomId = roomId;
    currentPlayerId = playerId;

    document.getElementById("setup").style.display = "none";
    document.getElementById("roomInfo").style.display = "block";
    document.getElementById("roomCode").textContent = roomId;

    // 이 플레이어가 호스트인지 확인 → 호스트에게만 시작 버튼 노출
    db.ref(`rooms/${roomId}/hostId`).get().then(snapshot => {
      isHostPlayer = snapshot.val() === playerId;
      document.getElementById("startGameBtn").style.display = isHostPlayer ? "block" : "none";
      document.getElementById("hostHint").style.display = isHostPlayer ? "none" : "block";
    });

    // 게임 시작 여부 구독 → 호스트가 누르면 전원 화면 전환
    db.ref(`rooms/${roomId}/status`).on("value", snapshot => {
      const status = snapshot.val();

      if (status === "started") {
        document.getElementById("roomInfo").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
      } else if (status === "battle") {
        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("battleScreen").style.display = "block";
      }
    });

    // 속도(턴 순서) 상태 구독 — 내 차례 여부/몬스터 차례 처리/연출 동기화
    db.ref(`rooms/${roomId}/combat`).on("value", snapshot => {
      combatState = snapshot.val();
      if (!combatState) return;

      const ev = combatState.event;
      if (ev && ev.seq !== lastEventSeq) {
        lastEventSeq = ev.seq;
        if (ev.type === "monsterAttack" && currentMonsterSpriteKey) {
          playMonsterAttackAnim(currentMonsterSpriteKey);
        } else if (ev.type === "playerAttack") {
          slotAttack(ev.actor);
        }
      }

      renderBattleParty(currentPartyEntries);
      renderTurnQueue();
      updateTurnControls();
      maybeAutoSkip();
      maybeRunMonsterTurn();
    });

    // 전투 로그 공유 구독
    db.ref(`rooms/${roomId}/battleLog`).limitToLast(30).on("child_added", snapshot => {
      const v = snapshot.val();
      if (v && v.msg) log(v.msg);
    });

    // 몬스터 상태 실시간 구독 (HP바 갱신 + 피격/사망 모션)
    db.ref(`rooms/${roomId}/monster`).on("value", snapshot => {
      const monster = snapshot.val();
      if (!monster) return;

      currentMonsterSpriteKey = monster.spriteKey || null;
      currentMonsterName = monster.name || "몬스터";
      if (monster.spriteKey && !monsterSpriteReady) {
        initMonsterSprite(monster.spriteKey);
      }

      document.getElementById("monsterName").textContent = monster.name;
      const pct = Math.max(0, Math.round((monster.hp / monster.maxHp) * 100));
      document.getElementById("monsterHpBar").style.width = pct + "%";
      document.getElementById("monsterHpText").textContent = `${monster.hp} / ${monster.maxHp}`;

      const avatar = document.getElementById("monsterAvatar");

      if (monster.hp <= 0) {
        if (!avatar.classList.contains("dead")) {
          avatar.classList.add("dead");
          const btn = document.getElementById("attackBtn");
          btn.disabled = true;
          btn.textContent = "처치 완료";
          log("몬스터를 쓰러뜨렸다!");
        }
      } else if (lastMonsterHp !== null && monster.hp < lastMonsterHp) {
        if (currentMonsterSpriteKey && MONSTER_SPRITES[currentMonsterSpriteKey] && MONSTER_SPRITES[currentMonsterSpriteKey].hit) {
          playMonsterHitAnim(currentMonsterSpriteKey);
        } else {
          pulseHit(avatar);
        }
      }

      lastMonsterHp = monster.hp;
      renderTurnQueue();
      updateTurnControls();
    });

    db.ref(`rooms/${roomId}/players`).on("value", snapshot => {
      const playersObj = snapshot.val() || {};
      const entries = Object.entries(playersObj); // [ [playerId, data], ... ]

      // 내 데이터 캐시 (다른 기기에서 바뀌었을 가능성 대비 — stats/mana 등 공격 시 사용)
      myPlayerData = playersObj[playerId] || null;
      myClass = myPlayerData ? (myPlayerData.class || null) : null;
      currentPartyEntries = entries;

      renderLobbyList(entries);
      renderClassSelect(entries);
      renderBattleParty(entries);
      renderTurnQueue();
      updateTurnControls();
    });

    db.ref(`rooms/${roomId}/players/${playerId}`).onDisconnect().remove();
  }

  // ------------------------------------------------------------
  // 호스트 전용 — 게임 시작 (전원 화면 전환 트리거)
  // ------------------------------------------------------------
  function startGame() {
    if (!isHostPlayer || !currentRoomId) return;
    db.ref(`rooms/${currentRoomId}/status`).set("started");
  }

  // ------------------------------------------------------------
  // 속도(턴 순서) 시스템
  //  - 민첩이 높은 쪽이 먼저 행동, 동률이면 무작위로 순서 결정
  //  - 순서는 전투 시작 시 1번 정해지고 매 라운드 동일하게 반복
  //  - 내 차례가 아니면 행동 불가 (지켜보기)
  // ------------------------------------------------------------
  const MONSTER_AGILITY = 5;

  // 받침 유무에 따라 조사 선택 (예: 숲지기가 / 탱커가 / 마녀가 → 받침 없으면 '가')
  function josa(word, withFinal, withoutFinal) {
    const w = String(word);
    const c = w.charCodeAt(w.length - 1);
    if (c < 0xAC00 || c > 0xD7A3) return w + withFinal + "(" + withoutFinal + ")";
    return w + (((c - 0xAC00) % 28) !== 0 ? withFinal : withoutFinal);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function buildTurnOrder(entries, monsterAgility) {
    const list = entries
      .filter(([id, p]) => p.class && p.stats)
      .map(([id, p]) => ({ id: id, agi: p.stats.agility, tie: Math.random() }));
    list.push({ id: "monster", agi: monsterAgility, tie: Math.random() });
    list.sort((a, b) => (b.agi - a.agi) || (a.tie - b.tie)); // 민첩 내림차순, 동률은 무작위
    return list.map(x => x.id);
  }

  function nameOf(id) {
    if (id === "monster") return currentMonsterName;
    const found = currentPartyEntries.find(([pid]) => pid === id);
    return found ? found[1].name : "???";
  }

  function monsterAlive() { return lastMonsterHp === null || lastMonsterHp > 0; }

  function isAliveForTurn(id) {
    if (id === "monster") return monsterAlive();
    const found = currentPartyEntries.find(([pid]) => pid === id);
    return !!found && (found[1].hp || 0) > 0;
  }

  function isMyTurn() {
    if (!combatState || !combatState.order) return false;
    if (actionInProgress) return false;
    if (!monsterAlive()) return false;
    if ((myPlayerData ? (myPlayerData.hp || 0) : 0) <= 0) return false;
    return combatState.order[combatState.index] === currentPlayerId;
  }

  // 다음 생존자에게 턴 넘기기 (죽은 캐릭터는 건너뜀)
  function advanceTurn() {
    return db.ref(`rooms/${currentRoomId}/combat`).transaction(c => {
      if (!c || !c.order) return c;
      let idx = c.index;
      let round = c.round || 1;
      for (let i = 0; i < c.order.length; i++) {
        idx = (idx + 1) % c.order.length;
        if (idx === 0) round++;
        if (isAliveForTurn(c.order[idx])) break;
      }
      c.index = idx;
      c.round = round;
      return c;
    });
  }

  // 행동 순서 표시 바
  function renderTurnQueue() {
    const bar = document.getElementById("turnBar");
    if (!bar || !combatState || !combatState.order) return;
    bar.innerHTML = `<div class="turn-round">ROUND ${combatState.round || 1}</div>`;

    combatState.order.forEach((id, i) => {
      const isMonster = id === "monster";
      const entry = isMonster ? null : currentPartyEntries.find(([pid]) => pid === id);
      const p = entry ? entry[1] : null;
      const classInfo = p && p.class ? CLASS_DATA.find(c => c.id === p.class) : null;

      const chip = document.createElement("div");
      chip.className = "turn-chip"
        + (isMonster ? " monster" : "")
        + (i === combatState.index ? " current" : "")
        + (!isAliveForTurn(id) ? " dead" : "")
        + (id === currentPlayerId ? " me" : "");
      chip.innerHTML = `
        <span class="tc-order">${i + 1}</span>
        <span class="tc-icon">${isMonster ? "🗿" : (classInfo ? classInfo.icon : "❔")}</span>
        <span class="tc-name">${esc(nameOf(id))}</span>
      `;
      bar.appendChild(chip);
    });
  }

  // 공격 버튼 활성/비활성 + 안내 문구
  function updateTurnControls() {
    const btn = document.getElementById("attackBtn");
    const hint = document.getElementById("turnHint");
    if (!btn || !hint || !combatState || !combatState.order) return;

    if (!monsterAlive()) {
      btn.classList.remove("my-turn");
      hint.className = "turn-hint";
      hint.textContent = "전투 종료";
      return;
    }

    const myHp = myPlayerData ? (myPlayerData.hp || 0) : 0;
    if (myHp <= 0) {
      btn.classList.remove("my-turn");
      hint.className = "turn-hint";
      hint.textContent = "";
      return;
    }

    const mine = isMyTurn();
    btn.disabled = !mine;
    btn.textContent = mine ? "기본 공격" : "대기 중...";
    btn.classList.toggle("my-turn", mine);

    const curId = combatState.order[combatState.index];
    hint.className = "turn-hint" + (mine ? " mine" : "");
    hint.textContent = mine ? "당신의 차례입니다!" : `${nameOf(curId)}의 턴 — 지켜보는 중...`;
  }

  // 내 차례인데 내가 이미 쓰러져 있으면 자동으로 넘김
  function maybeAutoSkip() {
    if (!combatState || !combatState.order || actionInProgress) return;
    if (!monsterAlive()) return;
    const cur = combatState.order[combatState.index];
    if (cur === currentPlayerId && myPlayerData && (myPlayerData.hp || 0) <= 0) {
      actionInProgress = true;
      const done = () => { actionInProgress = false; };
      advanceTurn().then(done, done);
    }
  }

  // 몬스터 차례는 호스트만 처리 (중복 실행 방지)
  function maybeRunMonsterTurn() {
    if (!isHostPlayer || monsterTurnInProgress) return;
    if (!combatState || !combatState.order || !monsterAlive()) return;
    if (combatState.order[combatState.index] !== "monster") return;

    monsterTurnInProgress = true;
    setTimeout(monsterTakeTurn, 1100); // 직전 플레이어 행동 연출을 볼 시간
  }

  function monsterTakeTurn() {
    const release = () => { monsterTurnInProgress = false; };

    db.ref(`rooms/${currentRoomId}/monster`).get().then(snapshot => {
      const monster = snapshot.val();
      if (!monster || monster.hp <= 0) { release(); return; }

      const aliveTargets = currentPartyEntries.filter(([id, p]) => p.maxHp && (p.hp || 0) > 0);
      if (aliveTargets.length === 0) {
        shareLog("파티가 전멸했다...");
        release();
        return;
      }

      // 전원 화면에서 몬스터 공격 모션 재생
      db.ref(`rooms/${currentRoomId}/combat/event`).set({ seq: Date.now(), type: "monsterAttack" });

      const [targetId, targetP] = aliveTargets[Math.floor(Math.random() * aliveTargets.length)];
      const judgment = rollJudgment();
      const baseMonsterDamage = 4;

      setTimeout(() => {
        const dmg = calcDamage(baseMonsterDamage, judgment);
        db.ref(`rooms/${currentRoomId}/players/${targetId}/hp`).transaction(hp => {
          if (hp === null || hp === undefined) return hp;
          return Math.max(0, hp - dmg);
        });
        shareLog(`${monster.name}의 공격! ${josa(targetP.name, "이", "가")} ${dmg} 피해를 입었다.${judgeLabel(judgment.resultType)}`);

        setTimeout(() => { advanceTurn().then(release, release); }, 900);
      }, 500);
    }).catch(release);
  }

  // ------------------------------------------------------------
  // 호스트 전용 — 전투 시작 (전원 직업 선택 완료 후에만 버튼이 보임)
  // ------------------------------------------------------------
  function startBattle() {
    if (!isHostPlayer || !currentRoomId) return;

    monsterSpriteReady = false; // 새 몬스터이므로 스프라이트 루프 재시작 허용

    const monsterData = {
      name: "고대 골렘",
      spriteKey: "golem",
      hp: 40,
      maxHp: 40,
      agility: MONSTER_AGILITY
    };

    // 민첩 순으로 행동 순서 확정 (동률은 무작위)
    const order = buildTurnOrder(currentPartyEntries, monsterData.agility);

    const updates = {};
    updates[`rooms/${currentRoomId}/monster`] = monsterData;
    updates[`rooms/${currentRoomId}/combat`] = { order: order, index: 0, round: 1 };
    updates[`rooms/${currentRoomId}/battleLog`] = null;

    db.ref().update(updates).then(() => {
      const names = order.map(id => id === "monster" ? monsterData.name : nameOf(id));
      shareLog(`전투 시작! 행동 순서: ${names.join(" → ")}`);
      return db.ref(`rooms/${currentRoomId}/status`).set("battle");
    });
  }

  // ------------------------------------------------------------
  // 기본 공격 — 내 차례일 때만 가능, 행동 후 턴이 다음 사람에게 넘어감
  // ------------------------------------------------------------
  function attack() {
    if (!myPlayerData || !myClass || !currentRoomId) {
      log("아직 직업/스탯 정보가 없어요.");
      return;
    }
    if ((myPlayerData.hp || 0) <= 0) {
      log("쓰러져서 움직일 수 없다...");
      return;
    }
    if (!isMyTurn()) {
      log("지금은 내 차례가 아니에요. 지켜보세요.");
      return;
    }

    actionInProgress = true;
    updateTurnControls();

    const classInfo = CLASS_DATA.find(c => c.id === myClass);
    const skillSet = CLASSES[myClass].skills;
    const basicSkill = Object.values(skillSet)[0]; // 각 직업의 첫 스킬(기본 공격)
    const myName = myPlayerData.name;

    db.ref(`rooms/${currentRoomId}/combat/event`).set({ seq: Date.now(), type: "playerAttack", actor: currentPlayerId });

    const actorStats = Object.assign({}, myPlayerData.stats); // 복사본 (resolveSkillAction이 mana를 직접 수정함)

    const unlock = () => { actionInProgress = false; updateTurnControls(); };
    const finish = () => { advanceTurn().then(unlock, unlock); };

    db.ref(`rooms/${currentRoomId}/monster`).get().then(snapshot => {
      const monster = snapshot.val();
      if (!monster || monster.hp <= 0) { unlock(); return; }

      const result = resolveSkillAction(actorStats, basicSkill);

      if (result.reason) { // 마나 부족 등 → 턴만 소모 (진행이 멈추는 것 방지)
        shareLog(`${myName}(${classInfo.name})의 ${result.reason}으로 턴을 넘겼다.`);
        finish();
        return;
      }

      db.ref(`rooms/${currentRoomId}/players/${currentPlayerId}/stats/mana`).set(actorStats.mana);

      shareLog(`${myName}(${classInfo.name})의 ${basicSkill.name} → 주사위 [${result.dice.join(",")}] → ${result.damage} 데미지!${judgeLabel(result.resultType)}`);

      db.ref(`rooms/${currentRoomId}/monster`).transaction(m => {
        if (!m) return m;
        m.hp = Math.max(0, m.hp - result.damage);
        return m;
      }).then(finish, finish);
    }).catch(unlock);
  }

  // 전투 로그 — 전원에게 공유 (지켜보는 사람도 상황을 볼 수 있게)
  function shareLog(message) {
    if (!currentRoomId) return;
    db.ref(`rooms/${currentRoomId}/battleLog`).push({ msg: message, t: Date.now() });
  }

  function log(message) {
    const logEl = document.getElementById("battleLog");
    const line = document.createElement("div");
    line.textContent = message;
    logEl.prepend(line);
  }
</script>

</body>
